<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TESSL | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e1a;
            --bg-card: #0f1420;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: linear-gradient(135deg, #0a0e1a 0%, #0f1420 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .auth-card {
            background: rgba(15, 20, 32, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .logo-icon i { font-size: 28px; color: white; }
        .logo h2 { font-weight: 700; margin: 0; }
        .form-control {
            background: rgba(26, 34, 54, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: var(--text-primary);
            padding: 14px 16px;
            border-radius: 12px;
        }
        .form-control:focus {
            background: rgba(26, 34, 54, 1);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
            color: var(--text-primary);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            padding: 14px;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
        }
        .toggle-link {
            color: var(--accent-primary);
            text-decoration: none;
            cursor: pointer;
        }
        .alert {
            border-radius: 12px;
            background: rgba(239,68,68,0.1);
            border-left: 3px solid #ef4444;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="logo">
            <div class="logo-icon"><i class="bi bi-lightning-charge-fill"></i></div>
            <h2>TESSL</h2>
            <p class="text-secondary">Enterprise Cloud Platform</p>
        </div>

        <div id="login-form">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, msg in messages %}
                    <div class="alert alert-{{ category }}">{{ msg }}</div>
                {% endfor %}
            {% endwith %}
            
            <form method="POST">
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
            
            {% if registration_enabled %}
            <p class="text-center mt-4">
                <a href="#" class="toggle-link" onclick="toggleForms()">Create an account</a>
            </p>
            {% endif %}
        </div>

        {% if registration_enabled %}
        <div id="register-form" style="display:none;">
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
            <p class="text-center mt-4">
                <a href="#" class="toggle-link" onclick="toggleForms()">Back to Login</a>
            </p>
        </div>
        {% endif %}
    </div>
</div>

<script>
function toggleForms() {
    const login = document.getElementById('login-form');
    const register = document.getElementById('register-form');
    if (login.style.display === 'none') {
        login.style.display = 'block';
        register.style.display = 'none';
    } else {
        login.style.display = 'none';
        register.style.display = 'block';
    }
}
</script>
</body>
</html>
